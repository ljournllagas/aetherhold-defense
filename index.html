<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aegis of the Borderkeep — Ancient Border Keep</title>
    <meta name="description" content="Aegis of the Borderkeep: defend the Ancient Border Keep from the Gloomtide in an original fantasy tower defense." />
    <meta name="theme-color" content="#0A0E12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aegis TD" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!-- Menu art starts downloading while the game script is still being fetched and parsed. -->
    <link rel="preload" as="image" type="image/webp" href="/assets/world/vistas/ancient-border-keep-vista-menu-v3.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/branding/aegis-emblem-v2.webp" />
    <style>
      #boot-splash{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 16px;box-sizing:border-box;background:#0A0E12;color:#d7aa4e;text-align:center;font-family:Cinzel,Georgia,serif;transition:opacity .25s ease}
      #boot-splash.is-done{opacity:0;pointer-events:none}
      #boot-splash h1{margin:0;font-size:clamp(20px,5vw,34px);font-weight:700;letter-spacing:.04em}
      #boot-splash p{margin:0;font:500 14px/1.4 system-ui,sans-serif;color:#b7c0c7}
      #boot-splash .bar{width:min(240px,70vw);height:4px;border-radius:2px;background:#19232d;overflow:hidden}
      #boot-splash .bar::after{content:"";display:block;width:40%;height:100%;background:#d7aa4e;animation:boot-slide 1.1s ease-in-out infinite}
      @keyframes boot-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#boot-splash .bar::after{animation:none;width:100%;opacity:.6}#boot-splash{transition:none}}
    </style>
  </head>
  <body>
    <div id="game-root">
      <div id="boot-splash" role="status" aria-live="polite">
        <h1>AEGIS OF THE BORDERKEEP</h1>
        <div class="bar" aria-hidden="true"></div>
        <p>Loading the borderlands…</p>
      </div>
    </div>
    <div id="pwa-install-bar" hidden>
      <span id="pwa-install-text">Install Aegis for fullscreen offline play</span>
      <button id="pwa-install-btn" type="button">Install</button>
      <button id="pwa-install-dismiss" type="button" aria-label="Dismiss">✕</button>
    </div>
    <div id="pwa-update-bar" hidden>
      <span>Update available — restart to apply</span>
      <button id="pwa-update-btn" type="button">Restart</button>
      <button id="pwa-update-dismiss" type="button" aria-label="Dismiss">✕</button>
    </div>
    <div id="pwa-ios-sheet" hidden>
      <div class="pwa-ios-panel" role="dialog" aria-label="Install instructions">
        <h2>Install Aegis</h2>
        <p>Tap Share, then “Add to Home Screen” to install fullscreen offline play.</p>
        <button id="pwa-ios-close" type="button">Got it</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
