name = "aetherhold-defense"
compatibility_date = "2024-11-01"
main = "worker/index.ts"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "aetherhold_scores"
database_id = "525d1d30-44a3-4f8f-a4e6-923d32f4a9bc"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://aetherhold-defense.ljournllagas.workers.dev"
ACCOUNT_LOGIN_REQUIRED = "1"

[[ratelimits]]
name = "SCORE_RATE_LIMITER"
namespace_id = "3867429103"
simple = { limit = 10, period = 60 }
